name: Deploy WIN Backend to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'win-dashboard/server.ts'
      - 'win-dashboard/package.json'
      - 'win-dashboard/package-lock.json'
      - 'win-dashboard/tsconfig.json'
      - 'win-dashboard/tsconfig.node.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: win-dashboard/package-lock.json

      - name: Instalar dependencias
        working-directory: win-dashboard
        run: npm ci

      - name: Compilar TypeScript
        working-directory: win-dashboard
        run: npx tsc -b

      - name: Desplegar a Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'Trakingwin-dashboard-backend'   # <-- Crear App Service separado para el backend Express
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: win-dashboard
