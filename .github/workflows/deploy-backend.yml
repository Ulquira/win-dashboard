name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy_pkg/src
          cp -r dist deploy_pkg/
          cp -r src/server deploy_pkg/src/
          cp server.ts package.json package-lock.json tsconfig.json tsconfig.node.json tsconfig.app.json deploy_pkg/

      - name: Install production dependencies in package
        run: |
          cd deploy_pkg
          npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'win-dashboard-api'
          package: deploy_pkg
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}